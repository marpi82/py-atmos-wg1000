name: Bug report
description: Something is broken or behaves unexpectedly in py-atmos.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        **Security issues must not be filed here.** Use [private vulnerability reporting](https://github.com/marpi82/py-atmos/security/advisories/new) or email `marpi82.dev@google.com` (see [SECURITY.md](https://github.com/marpi82/py-atmos/blob/main/SECURITY.md)).

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the problem.
      placeholder: e.g. AtmosFeed republishes unchanged temperature words on every poll.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened (include error messages / traceback if any).
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Minimal steps. Prefer a short async snippet using `AtmosClient` / `AtmosFeed` / `LanguageCatalog`.
      placeholder: |
        1. …
        2. …
        3. …
      render: markdown
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - py-atmos version / git SHA:
        - Python version:
        - Gateway firmware (if known):
        - OS:
        - Home Assistant version (if relevant):
      render: markdown
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - WebSocket client (`AtmosClient`)
        - Protocol codec (`pyatmos.protocol`)
        - Language catalog (`LanguageCatalog`)
        - Feed / ValueStore / EventBus
        - Docs
        - CI / packaging
        - Other / unsure
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
        - label: I can reproduce this offline with captured frames / fixtures when practical.
          required: false
