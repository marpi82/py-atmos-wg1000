title = "py-atmos-wg1000 gitleaks configuration"

[allowlist]
description = "Global allowlist for false positives"
paths = [
  '''^docs/_build/''',
  '''^dist/''',
  '''^build/''',
  '''^tests/fixtures/''',
]

regexes = [
  '''(?i)example''',
  '''(?i)dummy''',
  '''(?i)sample''',
  '''(?i)placeholder''',
  '''(?i)changeme'''
]
